services:
  deepseek-vllm:
    image: lmsysorg/sglang:latest
    container_name: deepseek_r1_sglang
    runtime: nvidia
    ipc: host
    environment:
      CUDA_VISIBLE_DEVICES: "${DEEPSEEK_CUDA_VISIBLE_DEVICES:-0,1}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      HF_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
    ports:
      - "${DEEPSEEK_HOST_PORT:-8000}:8000"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/vllm_cache:/root/.cache/huggingface
      - ${SCRATCH_ROOT:-./.runtime}/vllm_logs:/logs
    command: >
      python3 -m sglang.launch_server
      --host 0.0.0.0
      --port 8000
      --model-path ${DEEPSEEK_MODEL_ID:-deepseek-ai/DeepSeek-R1-Distill-Llama-70B}
      --served-model-name ${OPENAI_MANAGER_MODEL_NAME:-deepseek-r1-distill-llama-70b}
      --tp ${DEEPSEEK_TENSOR_PARALLEL_SIZE:-2}
      --dtype bfloat16
      --context-length ${DEEPSEEK_CONTEXT_LENGTH:-131072}
      --mem-fraction-static ${DEEPSEEK_MEM_FRACTION_STATIC:-0.93}
      --chunked-prefill-size ${DEEPSEEK_CHUNKED_PREFILL_SIZE:-8192}
      --max-prefill-tokens ${DEEPSEEK_MAX_PREFILL_TOKENS:-131072}
      --max-running-requests ${DEEPSEEK_MAX_RUNNING_REQUESTS:-64}
      --disable-cuda-graph
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    networks:
      - hackathon_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${DEEPSEEK_GPU_COUNT:-2}
              capabilities: [gpu]

  llama-vllm:
    image: vllm/vllm-openai:latest
    container_name: llama33_70b_inference
    runtime: nvidia
    ipc: host
    environment:
      CUDA_VISIBLE_DEVICES: "${LLAMA_CUDA_VISIBLE_DEVICES:-2,4}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-flash_attn}"
      VLLM_GPU_MEMORY_UTILIZATION: "${LLAMA_GPU_MEMORY_UTILIZATION:-0.98}"
    ports:
      - "${LLAMA_HOST_PORT:-8002}:8000"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/vllm_cache:/root/.cache/huggingface
      - ${SCRATCH_ROOT:-./.runtime}/llama_vllm_logs:/logs
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${LLAMA_MODEL_ID:-meta-llama/Llama-3.3-70B-Instruct}
      --served-model-name ${OPENAI_WORKER_MODEL_NAME:-llama-3.3-70b-instruct}
      --tensor-parallel-size ${LLAMA_TENSOR_PARALLEL_SIZE:-2}
      --dtype bfloat16
      --max-model-len ${LLAMA_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${LLAMA_GPU_MEMORY_UTILIZATION:-0.98}
      --max-num-seqs ${LLAMA_MAX_NUM_SEQS:-32}
      --max-num-batched-tokens ${LLAMA_MAX_BATCHED_TOKENS:-16384}
      --disable-log-requests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    networks:
      - hackathon_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${LLAMA_GPU_COUNT:-2}
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_memory_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/qdrant_data:/qdrant/storage
      - ${SCRATCH_ROOT:-./.runtime}/qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - hackathon_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_embeddings
    ports:
      - "11434:11434"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/ollama_models:/root/.ollama
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - hackathon_net

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 20gb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - hackathon_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: hackathon_frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - hackathon_net

  agent-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: hackathon_agents
    environment:
      OPENAI_PROVIDER: ${OPENAI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://llama-vllm:8000/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-llama-3.3-70b-instruct}
      OPENAI_WORKER_PROVIDER: ${OPENAI_WORKER_PROVIDER:-openai}
      OPENAI_WORKER_API_KEY: ${OPENAI_WORKER_API_KEY:-dummy}
      OPENAI_WORKER_API_BASE: ${OPENAI_WORKER_API_BASE:-http://llama-vllm:8000/v1}
      OPENAI_WORKER_MODEL_NAME: ${OPENAI_WORKER_MODEL_NAME:-llama-3.3-70b-instruct}
      OPENAI_MANAGER_PROVIDER: ${OPENAI_MANAGER_PROVIDER:-openai}
      OPENAI_MANAGER_API_KEY: ${OPENAI_MANAGER_API_KEY:-dummy}
      OPENAI_MANAGER_API_BASE: ${OPENAI_MANAGER_API_BASE:-http://deepseek-vllm:8000/v1}
      OPENAI_MANAGER_MODEL_NAME: ${OPENAI_MANAGER_MODEL_NAME:-deepseek-r1-distill-llama-70b}
      OPENAI_EVAL_PROVIDER: ${OPENAI_EVAL_PROVIDER:-openai}
      OPENAI_EVAL_API_KEY: ${OPENAI_EVAL_API_KEY:-dummy}
      OPENAI_EVAL_API_BASE: ${OPENAI_EVAL_API_BASE:-http://deepseek-vllm:8000/v1}
      OPENAI_EVAL_MODEL_NAME: ${OPENAI_EVAL_MODEL_NAME:-deepseek-r1-distill-llama-70b}
      OPENAI_QA_PROVIDER: ${OPENAI_QA_PROVIDER:-openai}
      OPENAI_QA_API_KEY: ${OPENAI_QA_API_KEY:-dummy}
      OPENAI_QA_API_BASE: ${OPENAI_QA_API_BASE:-http://llama-vllm:8000/v1}
      OPENAI_QA_MODEL_NAME: ${OPENAI_QA_MODEL_NAME:-llama-3.3-70b-instruct}
      OPENAI_MEMORY_API_KEY: ${OPENAI_MEMORY_API_KEY:-dummy}
      OPENAI_MEMORY_API_BASE: ${OPENAI_MEMORY_API_BASE:-http://llama-vllm:8000/v1}
      OPENAI_MEMORY_MODEL_NAME: ${OPENAI_MEMORY_MODEL_NAME:-llama-3.3-70b-instruct}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STAGEHAND_UI_URL: ${STAGEHAND_UI_URL:-http://frontend:5173}
      ENABLE_UI_QA: ${ENABLE_UI_QA:-false}
      ENABLE_CODEX_FIXER: ${ENABLE_CODEX_FIXER:-false}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    volumes:
      - ${SCRATCH_ROOT:-./.runtime}/agent_logs:/app/logs
      - ${SCRATCH_ROOT:-./.runtime}/agent_workdir:/app/workdir
    depends_on:
      deepseek-vllm:
        condition: service_healthy
      llama-vllm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hackathon_net

networks:
  hackathon_net:
    driver: bridge
